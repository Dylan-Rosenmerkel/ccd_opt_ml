# packet_recommended.toml -- the recommended packet layout (2026-10-13); reasons in docs/packet_design.md
#
# Same sequence as packet_example.toml, with
#   image: a 1x1 dark-current image that WADERs can fit: 16 rows x 1000 columns x 500 skips,
#          prescan 5300 (852 active + 148 overscan columns), register clear on, no exposure:
#          about 4.8 min, sigma ~0.26 e- (ch0/1/3), ~1000 one-electron pixels per channel
#   trace: match_image = true: the traces read their pixels exactly like the image (500 skips,
#          no binning), 2 x 5 pixels after a 100-pixel prescan burst, ~11 MB per channel;
#          5 reference + 10 trace sets (flush between sets): ~18.9 min per packet, 1.4 GB of traces
# WADERs: img_9.json with ccd_rows = 16, ccd_cols = 852 (configs/processing.toml).

packet_id = "recommended_00001"
scan_name = "example"

[options]
sequencer             = "reference_v5_pumping.seq"   # must be the file loaded on the boards (checked)
n_initial_flushes     = 3       # flushes at the reference before the first reference trace set
n_reference_traces    = 5       # reference trace sets (5: enough for the reference mean and scatter)
n_traces              = 10      # trace sets at the new parameters
flushes_between_traces = 1      # flushes between two trace sets (0: packet 12.1 instead of 18.9 min)
flushes_after_change  = 1       # flushes after going to the new parameters
n_final_flushes       = 1       # flushes after the image, back in standalone mode (take_image.py -f)
erase_policy          = "never" # "never" | "on_voltage_change" | "always" | "first_only" (never e-purge)
reference_traces      = "always"   # "always" | "when_different" | "never"
retake_damaged_traces = 1       # repeat a trace set once if a decoded trace lost data


[image]                         # 1x1 dark-current image (docs/packet_design.md)
subroutine = "AcquireImage"
acq_level  = 2
EXPOSURE = 0                    # the dark charge collects during the 4.8 min readout anyway
NDCM = 500                      # sigma ~0.26 e-: 0 and 1 e- pixels separate cleanly
NROW = 16
NCOL = 1000
NPBIN = 1
NSBIN = 1
NDCMPRE = 0
NROWPRE = 0
NROWPOST = 0
NCOLPRE = 5300                  # read the last 852 active columns, then 148 overscan columns
NCOLPOST = 0
BOOLCLR = 1

[trace]                         # read the pixels exactly like the image (NDCM, NSBIN, NPBIN, routine)
match_image = true              # own size: 2 x 5 pixels after a 100-pixel prescan (daq_commands.MATCHED_TRACE_SIZE)

[theta]                         # new parameters, shared by every board
delay_Va = 6000
delay_Vb = 6000
delay_Ha = 1800
delay_Hb = 1800
delay_Hc = 1800
V1_A_H = 9.9
V1_A_L = 7.9
V1_B_H = 9.9
V1_B_L = 7.7
V2_C_H = 9.9
V2_C_L = 7.9
V3_A_H = 9.9
V3_A_L = 7.9
V3_B_H = 9.9
V3_B_L = 7.7
TG_A_H = 7.4
TG_A_L = 7.4
TG_B_H = 7.4
TG_B_L = 7.4
H1_A_H = 9.5
H1_A_L = 6.7
H1_B_H = 9.5
H1_B_L = 6.5
H2_C_H = 9.0
H2_C_L = 6.7
H3_A_H = 9.5
H3_A_L = 6.7
H3_B_H = 9.5
H3_B_L = 6.5
VSUB = 48.0                     # <- the change (board 101)
VDD = -19.0                     # take_image.py always sets VDD = -19 first; here it is part of theta
VDRAIN = -23.0
VR = -3.0

[theta_board.102]               # board 102 gets a different VSUB
VSUB = 50.0

[theta_ref]                     # reference parameters, shared by every board
delay_Va = 6000
delay_Vb = 6000
delay_Ha = 1800
delay_Hb = 1800
delay_Hc = 1800
