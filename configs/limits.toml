# limits.toml -- allowed windows for every parameter the acquisition scripts may touch.
#
# HOW IT IS USED
#   * ccd_limits.Limits.load() reads this file; each [limits."<pattern>"] table is an
#     allowed window for every parameter whose name matches the glob <pattern>.
#   * The FIRST matching table wins, so keep specific patterns above general ones.
#   * A parameter with no matching table is REFUSED (unknown knobs are never touched).
#   * max_step (voltages only) is the largest change applied in one go; a bigger change
#     between two consecutive packets is ramped in steps of at most max_step, with every
#     intermediate state checked again.
#   * Hardware ranges (DAC / bias potentiometer, and the ACM manual's Table A.1: VR -13.8..-2,
#     VDD and VDRAIN -27.9..-6, VSUB 6.7..88.3 V; clock rails -10..+10 V with the offsets at -10 V)
#     are enforced in addition, in code (ccd_limits.py).
#   * The relationships between parameters (docs/voltage_rules.txt, 2026-10-14) are enforced in code
#     (ccd_limits.relational_constraints) on the COMPLETE configuration: pins a parameter set does not
#     contain take their [nominal] value below (the module's .bcf, module_PA03.bcf).
#   * Timing constants (10 ns clock cycles) have wide windows: their relations to each other are not
#     essential (the group, 2026-10-14); they affect data quality, not the CCD's safety.
#
# !! PROVISIONAL !!
#   The voltage windows below are narrow placeholders centred on the reference configuration
#   (reference.bcf / reference_v5_pumping.seq).  The relationships are now encoded; the windows
#   still have to be replaced by the group's voltage limits.  Then set reviewed = true.  The
#   acquisition scripts refuse to drive real hardware while reviewed = false.

[meta]
reviewed = false

# ---------------------------------------------------------------- sequencer ---
[limits.NDCM]            # number of skips per pixel
min = 1
max = 1000

# Image-size windows: widened on 2026-10-13 to the CCD (PHYSROW 1536, PHYSCOL 6144 + PRESCAN 8,
# from the .meta/FITS headers) plus overscan, for the recommended 1x1 image (16 x 1000 after a
# 5300-column prescan; docs/packet_design.md).  The size of a readout cannot harm the CCD.
[limits.NROW]
min = 1
max = 1700

[limits.NCOL]
min = 1
max = 6400

[limits.NPBIN]           # parallel (row) binning
min = 1
max = 40

[limits.NSBIN]           # serial (column) binning
min = 1
max = 40

[limits.EXPOSURE]        # seconds
min = 0
max = 600

[limits.NDCMPRE]         # fake skips before the integration
min = 0
max = 10

[limits.NROWPRE]         # rows skipped before / after the image
min = 0
max = 1536

[limits.NROWPOST]
min = 0
max = 200

[limits.NCOLPRE]         # columns skipped before / after the image
min = 0
max = 6152

[limits.NCOLPOST]
min = 0
max = 1000

[limits.BOOLCLR]         # clear the serial register before each row transfer (0/1)
min = 0
max = 1

[limits."delay_V?"]      # vertical transfer hold times [10 ns cycles] (reference 6000)
min = 1000
max = 20000

[limits."delay_H?"]      # horizontal transfer hold times, delay_Ha/Hb/Hc [10 ns cycles] (reference 1800)
min = 200
max = 6000

[limits.delayInt]        # CDS integration window, pedestal and signal [10 ns cycles] (reference 1000)
min = 50
max = 20000

[limits."delayRG?"]      # reset gate low / high holds (reference 27 / 800)
min = 1
max = 10000

[limits."delaySW?"]      # summing well holds (reference 30 / 350)
min = 1
max = 10000

[limits."delayOG?"]      # output gate holds (reference 48 / 3)
min = 1
max = 10000

[limits."delayDG?"]      # dump gate holds (reference 27 / 47)
min = 1
max = 10000

[limits.NVWAIT]          # extra wait for the serial-register exposure [ms]
min = 0
max = 1000

[limits.NPSD]            # PSD repetitions [ms]
min = 1
max = 1000

# ------------------------------------------------------------------ biases ---
[limits.VSUB]
min = 40.0
max = 60.0
max_step = 5.0

[limits."VDD?"]
min = -21.0
max = -17.0
max_step = 1.0

[limits."VDRAIN?"]
min = -25.0
max = -21.0
max_step = 1.0

[limits."VR?"]
min = -4.0
max = -2.0
max_step = 0.5

# ------------------------------------------------------------ clock levels ---
[limits."V?_?_H"]        # vertical clocks, high level (rails reach at most +10 V: ACM manual A.3.4)
min = 8.4
max = 10.0
max_step = 0.5

[limits."V?_?_L"]        # vertical clocks, low level
min = 6.4
max = 9.4
max_step = 0.5

[limits."H?_?_H"]        # horizontal clocks, high level
min = 8.0
max = 11.0
max_step = 0.5

[limits."H?_?_L"]        # horizontal clocks, low level
min = 5.2
max = 8.2
max_step = 0.5

[limits."TG_?_?"]        # transfer gates
min = 5.9
max = 8.9
max_step = 0.5

# ----------------------------------------------------------- readout stages ---
# SW, OG, RG, DG of readout stages 1 and 2: placeholders +-2 V around the reference, to be reviewed.
[limits."SW_?_H"]
min = -1.0
max = 3.0
max_step = 0.5

[limits."SW_?_L"]
min = -8.0
max = -4.0
max_step = 0.5

[limits."OG_?_H"]
min = -2.0
max = 2.0
max_step = 0.5

[limits."OG_?_L"]
min = -8.0
max = -4.0
max_step = 0.5

[limits."RG_?_H"]
min = 7.0
max = 10.0
max_step = 0.5

[limits."RG_?_L"]
min = 1.0
max = 5.0
max_step = 0.5

[limits."DG_?_H"]
min = -2.0
max = 2.0
max_step = 0.5

[limits."DG_?_L"]
min = -7.0
max = -3.0
max_step = 0.5

