# processing.toml -- settings of src/process_packet.py
#
# process_packet.py turns one packet (its manifest + the raw files) into training data:
#   1. traces  -> decoded arrays (.npz) + trace features (features.json)
#   2. images  -> decompressed FITS (.fits) -> WADERs (panaSKImg) -> sigma_e, gain, lambda
#   3. grouping -> one row per (packet, board, channel) in dataset.csv / dataset.jsonl

[output]
dir = "../processed"          # relative paths are relative to this file's directory

# The manifests store paths as seen on the DAQ machine.  When the files are processed on
# another computer, map the DAQ directory prefix to the local copy (first match wins).
[paths]
"/home/damicm/run/PA_PQ_testing" = "../data"

[traces]
save_raw = true               # keep every decoded sample (values + flags) in a compressed .npz
# The features (src/trace_features.py) always use the usable pixels (no row-start or charged pixels).

[waders]
# WHICH ROUTE (2026-10-16, after the level-1 rehearsal, lvl1/rehearsal_report/REHEARSAL.md):
#   runner = "run_WADERs"  comm_scripts' run_WADERs (~/Documents/Software/comm_scripts): builds the panaSKImg configuration
#                          per CCD from the image itself (geometry from the header: ccd_cols = PHYSCOL - NCOLPRE + PRESCAN;
#                          gain, noise, pedestal method) and fits only the Poisson-like 0e-/1e- peaks.  On simulated
#                          16 x 1000 x 500 images: sigma_e +1.6 %, lambda +4 %, gain 0 % (median; 18 labels).  DEFAULT.
#                          --keep-dead: its dead-channel test needs charged pixels that a 16-row image with no exposure
#                          may not have (it dropped a working channel in the rehearsal); all four channels are connected.
#   runner = "panaSKImg"   one JSON for every image (json below + image_overrides).  With the planned image's geometry
#                          (ccd_rows 16, ccd_cols 852, id_row_start 0): sigma_e -8 %, lambda -12 %, gain +11 % in the
#                          same rehearsal, so it is kept only as an alternative.
runner = "run_WADERs"
run_waders_command = ["/Users/dylanrosenmerkel/Documents/Software/comm_scripts/bin/run_WADERs"]
run_waders_args = ["--no-clusters", "--all-ext", "--overwrite", "--autoconfig-args=--keep-dead"]   # --all-ext (2026-11-03): ch3 of board 101 has resolved peaks but run_WADERs skips it as an "outlier CCD"
# How to start panaSKImg.  On this laptop it lives in the conda environment "damic" ("conda run"
# sets up ROOT's environment; importing ROOT without it crashes); on the DAQ machine it may
# simply be ["panaSKImg"].
command = ["/opt/homebrew/Caskroom/miniforge/base/bin/conda", "run", "-n", "damic", "panaSKImg"]
# WADERs configuration (the one used for the 2026-10-06 image).  Its [input][image] geometry
# (ccd_rows, ccd_cols = active region; the rest is overscan) must fit the packet images:
# img_9.json is for 100 x 1000 images with 854 active columns.
json = "/Users/dylanrosenmerkel/Documents/Software/json/img_9.json"
extra_args = ["--acm"]        # the FITS file is an ACM multi-extension image (4 channels)
timeout_s = 1800
# Directory of the pysimdamicm checkout, used to record the WADERs version (git commit).
pysimdamicm_dir = "/Users/dylanrosenmerkel/Documents/Software/pysimdamicm"

# Optional: replace entries of the JSON's [input][image] block for these packets (the modified
# JSON is saved next to the results).  Example for 100 x 130 images with 30 overscan columns:
# [waders.image_overrides]
# ccd_rows = 100
# ccd_cols = 100
[waders.image_overrides]
# (used only with runner = "panaSKImg"; for the planned 16 x 1000 x 500 image with NCOLPRE 5300:
#  ccd_rows = 16, ccd_cols = 852, id_row_start = 0 -- and ccd_cols = 652 when [drift] cuts 200 columns; run_WADERs
#  reads the geometry from the (corrected) image header and needs nothing here)

[drift]
# The along-row baseline drift of board 101 / PA03 (lvl1/real_image_checks/2026-10-16_PA03_PQ04_16rows.md): the zero-electron
# level starts ~1 ADU low at the start of every row's readout and recovers over a few hundred columns; the gain does not
# change, the noise is raised in the first ~200 columns.  src/image_drift.py detects it (Gaussian fits of the zero-electron
# peak per column block); if present, the first `cut` columns are removed and the slow remainder subtracted, and WADERs
# and the per-row fit use that copy.  Images without a drift are used unchanged.  Labels record drift_corrected,
# drift_cut and drift_warning (the drift differs between the row halves: the correction may not be trustworthy).
# 2026-11-03: OFF for the 2026-11-02/03 packets.  Their raw images fit well (chi2/ndf 0.8-1.3 at nominal) and several
# corrected copies did NOT (sigma_e 0.145 -> 0.348 e on L1_06 ch0, 0.238 -> 0.694 on L1_03 ch0).  Worse for any mix: the
# subtraction raises lambda by 7-10 % on EVERY channel, even where it fits well (L1_14 ch0 0.309 -> 0.331), so labels
# from corrected and uncorrected images are not comparable.  If it is turned on, it must apply to the whole dataset;
# then BOTH copies are labelled (the first `cut` columns removed from both, cut_columns) and per channel the corrected
# labels are kept only if they measure less noise with a fit no worse than (1 + margin) x the cut copy's chi2/ndf
# (process_packet.fit_choice).  See docs/context/2026-11-03.
enabled = false
margin = 0.1                  # the corrected copy's chi2/ndf may exceed the cut copy's by at most this fraction
cut = 200                     # fixed for every packet (calibrated on the 2026-10-16 images); "auto" = per image (diagnostic)
channels = [0, 1, 3]          # the channels that decide (ch2's zero peak is usually not resolved)
width_tol = 0.05

[rows]
# lambda row by row (WADERs' gain and noise held fixed) and the straight line lambda_r = CIC + DC x_r through the
# rows (src/image_rows.py): labels lambda_dark, lambda_cic with errors and covariance.
enabled = true
reverse = false               # set true if FITS row 0 is the LAST row read out (then DC comes out negative)

[model_inputs]
# After dataset.csv: one ready-to-train file per model family in <output dir>/model_inputs/ (src/ml/real_inputs.py).
enabled = true
